# fly launch で上書きされる app 名は後で変更してください
app = "pocket-money-fyewsw"
primary_region = "nrt"   # 東京リージョン

[build]

[env]
  PORT     = "3000"
  NODE_ENV = "production"

# SQLite ファイルを永続化するボリューム
[[mounts]]
  source      = "okozukai_data"
  destination = "/data"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = "stop"   # アクセスがない間はマシンを停止（コスト節約）
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
